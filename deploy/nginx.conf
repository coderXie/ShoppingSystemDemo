# ==============================================================================
# Nginx — ai-shop-agent 前端 + 反向代理
# 前端：Vue3 SPA 静态资源
# 后端：反向代理 /api/ → ai-backend:8080
# SSE：关闭缓冲，支持小彦客服流式打字机效果
# ==============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20m;

    # ---- Gzip 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ---- 后端上游 ----
    upstream backend {
        server ai-backend:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ---- Vue SPA History Fallback ----
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---- 反向代理：后端 API ----
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # ---- 超时（AI 推理可能较慢） ----
            proxy_connect_timeout 60s;
            proxy_read_timeout    300s;
            proxy_send_timeout    60s;
        }

        # ---- SSE 流式事件专用（小彦客服打字机效果） ----
        location /api/agent/events {
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # SSE 核心：关闭所有缓冲，数据即时推送到客户端
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # SSE 长连接超时（5 分钟）
            proxy_read_timeout 300s;

            # 禁用 gzip（SSE 文本流压缩可能导致事件延迟）
            gzip off;
        }

        # ---- 静态资源缓存策略 ----
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ---- 健康检查 ----
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
