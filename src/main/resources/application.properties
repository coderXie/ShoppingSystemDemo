# ===========================================
# Spring Boot Core
# ===========================================
spring.application.name=ai-shop-agent
server.port=8080

# ===========================================
# DataSource (MySQL 8.x)
# ===========================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/shop_agent_dispatch?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=5028

# ===========================================
# JPA / Hibernate
# ===========================================
# 开发阶段自动更新 schema；生产环境建议改为 validate 或 none
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===========================================
# Jackson (JSON 序列化)
# ===========================================
# 日期格式化为字符串
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.serialization.write-dates-as-timestamps=false

# ===========================================
# LangChain4j (DeepSeek)
# ===========================================
# DeepSeek 提供 OpenAI 兼容 API，通过 base-url 切换即可。
# 请前往 https://platform.deepseek.com/api_keys 获取 API Key，
# 并通过环境变量 DEEPSEEK_API_KEY 注入，或直接在下方填写。
langchain4j.open-ai.chat-model.base-url=https://api.deepseek.com
langchain4j.open-ai.chat-model.api-key=${DEEPSEEK_API_KEY:sk-f53df2d31b33420ca41e20e771447f7e}
langchain4j.open-ai.chat-model.model-name=deepseek-v4-pro
langchain4j.open-ai.chat-model.temperature=0.7
langchain4j.open-ai.chat-model.timeout=PT60S
langchain4j.open-ai.chat-model.max-tokens=2000

# ===========================================
# Logging
# ===========================================
# 开发期打开 SQL 与 LangGraph 调试日志
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.bsc.langgraph4j=DEBUG
logging.level.dev.langchain4j=DEBUG
