# ===========================================
# Spring Boot Core
# ===========================================
spring.application.name=ai-shop-agent
server.port=8080

# ===========================================
# DataSource (MySQL 8.x)
# ===========================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/shop_agent_dispatch?useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:5028}
# SQL 脚本初始化配置：
# - always: 每次启动都执行（开发环境使用，但会导致重复数据问题）
# - embedded: 仅对内存数据库执行（推荐用于 H2）
# - never: 从不执行（生产环境推荐）
# 使用 MySQL 时，为避免重复数据插入导致的主键冲突，建议设为 never
# 如需重新初始化数据，可临时改为 always 后启动一次，再改回 never
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8
spring.sql.init.platform=mysql

# ===========================================
# JPA / Hibernate
# ===========================================
# 开发阶段自动更新 schema；生产环境建议改为 validate 或 none
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===========================================
# Jackson (JSON 序列化)
# ===========================================
# 日期格式化为字符串
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.serialization.write-dates-as-timestamps=false

# ===========================================
# LangChain4j (DeepSeek)
# ===========================================
# DeepSeek 提供 OpenAI 兼容 API，通过 base-url 切换即可。
# 请前往 https://platform.deepseek.com/api_keys 获取 API Key，
# 必须通过环境变量 DEEPSEEK_API_KEY 注入（禁止硬编码密钥）。
# 启动示例：DEEPSEEK_API_KEY=sk-xxx ./mvnw spring-boot:run
langchain4j.open-ai.chat-model.base-url=https://api.deepseek.com
langchain4j.open-ai.chat-model.api-key=${DEEPSEEK_API_KEY}
langchain4j.open-ai.chat-model.model-name=deepseek-chat
langchain4j.open-ai.chat-model.temperature=0.7
langchain4j.open-ai.chat-model.timeout=PT60S
langchain4j.open-ai.chat-model.max-tokens=2000

# ===========================================
# Logging
# ===========================================
# 日志输出到文件
logging.file.name=runtime.log
# 开发期打开 SQL 与 LangGraph 调试日志
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.bsc.langgraph4j=DEBUG
logging.level.dev.langchain4j=DEBUG
