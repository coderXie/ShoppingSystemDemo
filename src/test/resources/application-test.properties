# 测试环境使用 H2 内存数据库
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA 配置
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# 禁用 data.sql / schema.sql（避免 H2 执行 MySQL 语法报错）
spring.sql.init.mode=never

# 关闭 LangChain4j 自动配置（测试中不需要真实调用大模型）
langchain4j.open-ai.chat-model.api-key=test-key
langchain4j.open-ai.chat-model.model-name=test-model
langchain4j.open-ai.chat-model.base-url=http://localhost:9999

# 日志
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.bsc.langgraph4j=DEBUG
